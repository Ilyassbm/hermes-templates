name: hermes-templates
label: Agent Templates
kind: standalone
version: 1.3.1
author: Ilyass Bm
license: MIT
description: >
  One-click share and install of a whole Hermes agent. `hermes template create` packs a profile
  into a single `.htemplate` bundle — identity (SOUL.md), configuration, skills, routines, MCP
  servers, published memories and plugin ids — and `hermes template install` turns a bundle or a
  link into a new profile. Credentials, sessions, conversation history, logs and caches never
  travel; every text file is redacted with Hermes' own secret redactor before packing; install
  always previews first and shows what will run (SOUL.md, skills, every routine's schedule and
  prompt, every MCP command); routines arrive paused, MCP servers arrive disabled, the config is
  sanitized again on install, and plugins already installed on this machine are enabled unless
  you pass --no-enable-plugins. The Desktop app
  gets a Templates page with a Share tab and an Install tab (drag a bundle, or paste a link).
requires_hermes: ">=0.23"
config_schema:
  publish_repo:
    type: str
    default: ""
    label: "Publish repository"
    description: "GitHub repository the Publish button writes to: owner/name, or a bare name under the token's owner. Empty means agent-templates."
  github_token:
    type: secret
    env: GITHUB_TOKEN
    label: "GitHub token"
    description: "Fine-grained token with Contents: read and write (plus Administration: write if the repository must be created). Only needed to publish."
provides_tools: []
provides_hooks: []
