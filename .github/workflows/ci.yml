name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test deps
        run: python -m pip install --quiet pytest pyyaml
      - name: Python syntax
        run: python -m compileall -q agent_templates template_cli.py __init__.py dashboard/plugin_api.py
      - name: Desktop half parses
        run: node --check desktop/plugin.js
      - name: Tests
        # No Hermes install here on purpose: the suite must pass against the
        # fallbacks (vendored YAML reader, local secret patterns) too.
        env:
          HERMES_ROOT: /nonexistent
        run: python -m pytest -q tests/
